<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="canvas192" width="192" height="192"></canvas>
<canvas id="canvas512" width="512" height="512"></canvas>
<script>
function createIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, size, size);
  gradient.addColorStop(0, '#3b82f6');
  gradient.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  
  // Draw trophy emoji
  ctx.fillStyle = 'white';
  ctx.font = `bold ${size * 0.5}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏆', size / 2, size / 2);
}

createIcon(document.getElementById('canvas192'), 192);
createIcon(document.getElementById('canvas512'), 512);

// Download instructions
document.body.innerHTML += '<p>Right-click each canvas and "Save image as..."</p>';
document.body.innerHTML += '<p>Save as icon-192x192.png and icon-512x512.png</p>';
</script>
</body>
</html>
